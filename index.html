<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de documentos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>document.write('<script src="js/engine.js?v=' + Date.now() + '"><\/script>')</script>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#525659}
  #msg{color:#fff;padding:24px;max-width:640px;margin:auto;line-height:1.5}
  code{background:#0004;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div id="msg">Generando documento…</div>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  // Un documento: ?doc=fill-101  ó  ruta /fill-101 (con vercel.json / netlify)
  // Paquete:       ?docs=overlay-256,fill-101,fill-101  con parámetros 1_a1, 2_a1, 3_a1...
  const docs = (params.get("docs") || "").split(",").map((d) => d.trim()).filter(Boolean);
  const doc = params.get("doc") || location.pathname.split("/").filter(Boolean).pop() || "";
  const flatten = params.get("edit") === "0" || params.get("final") === "1";   // editable por defecto
  const valid = (d) => /^(fill|overlay)-[a-z0-9_-]+$/i.test(d);

  // overlay-NNN y fill-NNN usan el mismo mapa si no existe uno propio (ligas viejas de gabodocs)
  async function load(d) {
    let res = await fetch(`maps/${d}.json`, { cache: "no-cache" });
    if (!res.ok) res = await fetch(`maps/${d.replace(/^overlay-/i, "fill-")}.json`, { cache: "no-cache" });
    if (!res.ok) throw new Error(`No existe el documento "${d}"`);
    const map = await res.json();
    if (!map.template) return { map, bytes: null };
    const t = await fetch(map.template, { cache: "no-cache" });
    if (!t.ok) throw new Error(`No se pudo cargar la plantilla ${map.template} (recarga con Ctrl+F5)`);
    return { map, bytes: await t.arrayBuffer() };
  }

  try {
    let out;
    if (docs.length) {
      if (!docs.every(valid)) throw new Error("Lista de documentos inválida: " + docs.join(", "));
      const parts = [];
      for (let i = 0; i < docs.length; i++) {
        const pre = `${i + 1}_`;
        const sub = new URLSearchParams();
        for (const [k, v] of params) if (k.startsWith(pre)) sub.set(k.slice(pre.length), v);
        const { map, bytes } = await load(docs[i]);
        const r = await DocFiller.buildPdf(bytes, map, sub, { flatten });
        if (r.log.length) console.warn(`Avisos ${docs[i]} (#${i + 1}):`, r.log);
        parts.push(r);
      }
      out = await DocFiller.mergePdfs(parts, { duplex: params.get("duplex") !== "0" });   // hoja en blanco tras docs impares (default); &duplex=0 la quita
    } else {
      if (!valid(doc)) {
        $("msg").innerHTML = "Uso: <code>?doc=fill-101&amp;a1=…</code> o <code>?docs=overlay-256,fill-101&amp;1_a1=…&amp;2_a1=…</code>";
        return;
      }
      const { map, bytes } = await load(doc);
      const r = await DocFiller.buildPdf(bytes, map, params, { flatten });
      if (r.log.length) console.warn("Avisos:", r.log);
      out = r.bytes;
    }

    const name = (params.get("name") || (docs.length ? "paquete" : doc)) + ".pdf";
    // Título del PDF = nombre del archivo (lo muestra la pestaña del visor)
    const titled = await PDFLib.PDFDocument.load(out);
    titled.setTitle(name.replace(/\.pdf$/, ""), { showInWindowTitleBar: true });
    out = await titled.save();

    const url = URL.createObjectURL(new Blob([out], { type: "application/pdf" }));
    if (params.get("download") === "1") {               // &download=1 baja el archivo directo
      const a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      $("msg").textContent = "Descargado: " + name;
    } else {
      location.replace(url);                              // abre el PDF directo en el visor del navegador
    }
  } catch (e) {
    $("msg").textContent = "Error: " + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
