<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de documentos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="js/engine.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#525659}
  iframe{width:100%;height:100%;border:0;display:none}
  #bar{position:fixed;right:12px;bottom:12px;display:none;gap:8px}
  #bar a{background:#1a73e8;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font-size:14px;box-shadow:0 2px 6px #0006}
  #msg{color:#fff;padding:24px;max-width:640px;margin:auto;line-height:1.5}
  code{background:#0004;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div id="msg">Generando documento…</div>
<iframe id="viewer" title="PDF"></iframe>
<div id="bar"><a id="open" target="_blank">Abrir</a><a id="dl">Descargar</a></div>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  // Documento: ?doc=fill-101  ó  ruta /fill-101 (con vercel.json / netlify)
  const doc = params.get("doc") || location.pathname.split("/").filter(Boolean).pop() || "";
  try {
    if (!/^(fill|overlay)-[a-z0-9_-]+$/i.test(doc)) {
      $("msg").innerHTML = "Uso: <code>?doc=fill-101&amp;a1=…&amp;a2=…</code><br>Documentos: <code>fill-101</code>, <code>fill-256</code>";
      return;
    }
    // overlay-NNN y fill-NNN usan el mismo mapa si no existe uno propio (ligas viejas de gabodocs)
    let res = await fetch(`maps/${doc}.json`);
    if (!res.ok) res = await fetch(`maps/${doc.replace(/^overlay-/i, "fill-")}.json`);
    if (!res.ok) throw new Error(`No existe el documento "${doc}"`);
    const map = await res.json();
    const bytes = await (await fetch(map.template)).arrayBuffer();

    const { bytes: out, log } = await DocFiller.buildPdf(bytes, map, params, {
      flatten: params.get("edit") !== "1",       // &edit=1 deja los campos editables
    });
    if (log.length) console.warn("Avisos:", log);

    const url = URL.createObjectURL(new Blob([out], { type: "application/pdf" }));
    const name = (params.get("name") || doc) + ".pdf";
    $("dl").href = url; $("dl").download = name;
    $("open").href = url;
    $("msg").remove();
    $("viewer").src = url; $("viewer").style.display = "block";
    $("bar").style.display = "flex";
    if (params.get("download") === "1") $("dl").click();   // &download=1 baja directo
  } catch (e) {
    $("msg").textContent = "Error: " + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
